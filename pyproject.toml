[project]
name = "archivist"
version = "0.1.0"
description = "An agentic RAG system over a private document corpus, built to be measured."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# The core package runs on the standard library alone so that the full pipeline
# (ingest -> index -> retrieve -> generate -> evaluate) is reproducible offline.
# Every production component is an opt-in adapter behind a port in ports.py.
[project.optional-dependencies]
openai = ["openai>=1.40"]
local-embeddings = ["sentence-transformers>=3.0"]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
service = ["fastapi>=0.115", "uvicorn>=0.30", "sse-starlette>=2.1"]
# httpx2 is what Starlette's TestClient imports. The service tests fail
# collection without it once the `service` extra is installed.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "httpx2>=2"]

[project.scripts]
archivist = "archivist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archivist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PTH", "ARG", "TID"]

[tool.mypy]
python_version = "3.11"
packages = ["archivist"]
mypy_path = "src"
strict = true
warn_unreachable = true

# Optional provider SDKs are not installed in the default dev environment;
# their adapters are guarded by a try/except import.
[[tool.mypy.overrides]]
module = ["openai", "openai.*", "sentence_transformers.*"]
ignore_missing_imports = true
